name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config ca-certificates curl \
            libcurl4-openssl-dev libssl-dev \
            liblua5.4-dev lua5.4 lua5.1 zip unzip binutils file

      # Portable build inside Ubuntu 22.04, gated to the documented glibc 2.34
      # floor by check-abi.sh (package.sh runs it again before zipping).
      - name: Build portable binary
        run: scripts/_build-portable.sh

      - name: Package
        run: scripts/package.sh

      - name: Verify artifact
        run: |
          test -f dist/lumen-linux.zip
          test -f dist/lumen-linux.zip.sha256
          ( cd dist && sha256sum -c lumen-linux.zip.sha256 )
          unzip -l dist/lumen-linux.zip | head -20

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          # The installer verifies the asset against <asset>.sha256, so both
          # files have to be published together.
          assets=(dist/lumen-linux.zip dist/lumen-linux.zip.sha256)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --title "$tag" \
              --generate-notes
          fi

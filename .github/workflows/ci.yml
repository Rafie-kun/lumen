name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config ca-certificates curl \
            libcurl4-openssl-dev libssl-dev \
            liblua5.4-dev lua5.4 lua5.1 zip unzip

      - name: Build
        run: make

      - name: Host test suite
        run: tools/run_all_tests.sh
